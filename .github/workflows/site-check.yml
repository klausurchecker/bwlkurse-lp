name: Site-Check

# Prueft die LIVE-Seiten (Landingpage + alle Fach-Apps) gegen .github/checks/site-manifest.json.
# Laeuft ohne Renes PC. Bei Fehlern: Job rot + Issue "Site-Check: Fehler auf klausurchecker.de".
on:
  schedule:
    - cron: "0 6 * * *"      # taeglich 06:00 UTC = 08:00 Berlin
  push:
    branches: [main]         # nach jedem Deploy
  workflow_dispatch:          # Knopf im Actions-Tab

permissions:
  contents: read
  issues: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auf GitHub-Pages-Deploy warten
        if: github.event_name == 'push'
        run: sleep 90

      - name: Site-Check ausfuehren
        id: check
        shell: pwsh
        run: |
          & ./.github/checks/check-site.ps1 -Markdown bericht.md
          exit $LASTEXITCODE

      - name: Bericht als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-check-bericht
          path: bericht.md
          if-no-files-found: ignore

      - name: Issue anlegen oder aktualisieren
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Der Site-Check ist fehlgeschlagen, der Bericht fehlt aber.';
            try { body = fs.readFileSync('bericht.md', 'utf8'); } catch (e) {}
            body += `\n\n---\nLauf: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const titel = 'Site-Check: Fehler auf klausurchecker.de';
            const offen = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'site-check'
            });

            if (offen.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: offen.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titel, body, labels: ['site-check']
              });
            }
